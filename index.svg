<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xhtml="http://www.w3.org/1999/xhtml"
     width="100%"
     height="100%"
     viewBox="0 0 1920 1080">

  <foreignObject x="0" y="0" width="1920" height="1080">
    <xhtml:iframe
      id="page"
      allow="fullscreen"
      style="position:fixed;inset:0;width:100%;height:100%;border:0;margin:0;padding:0;display:block;">
    </xhtml:iframe>
  </foreignObject>

  <script><![CDATA[
  (() => {
    const encoded = "";

    document.getElementById("page").srcdoc = atob(encoded);
  })();
  ]]></script>
</svg>
